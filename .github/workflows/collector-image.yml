# Testa o coletor e publica a imagem em ghcr.io/<dono>/ufcim-collector (amd64 e arm64).
# - push no main: publica :latest, :<versão do pyproject> e :sha-<curto>.
# - pull request: testa e monta as duas arquiteturas, sem publicar.
# Uso da imagem e migração para o IAUD: docs/AIR-QUALITY-COLLECTOR.md.
name: collector-image

on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collector-image.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Versão do pyproject
        id: version
        run: echo "value=$(python3 -c "import tomllib; print(tomllib.load(open('collector/pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          # A descrição do pacote no GHCR vem da anotação do índice multi-arch.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/ufcim-collector
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=ufcim-collector
            org.opencontainers.image.description=Coletor local de qualidade do ar do UFCIM (Tuya local -> Cloudflare Worker)
          annotations: |
            org.opencontainers.image.description=Coletor local de qualidade do ar do UFCIM (Tuya local -> Cloudflare Worker)

      - uses: docker/build-push-action@v7
        with:
          context: collector
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
