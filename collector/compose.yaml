# Coletor de um aparelho, configurado só pelo .env (ver .env.example).
# Imagem publicada pelo workflow collector-image (amd64 e arm64). Para fixar uma
# versão, defina UFCIM_IMAGE no .env, por exemplo ghcr.io/abner-augusto/ufcim-collector:0.1.0.
# Para testar uma alteração local sem publicar:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
# Ver docs/AIR-QUALITY-COLLECTOR.md, "Implantação".
services:
  collector:
    image: ${UFCIM_IMAGE:-ghcr.io/abner-augusto/ufcim-collector:latest}
    container_name: ufcim-collector
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - collector-data:/data      # outbox.sqlite3 e heartbeat
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  collector-data:
